apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sm-connector.fullname" . }}
  labels:
    {{- include "sm-connector.labels" . | nindent 4 }}
data:
  Api__EnableDetailedErrorMessages: {{ .Values.config.Api.EnableDetailedErrorMessages | quote }}
  Api__EnableOpenApiUi: {{ .Values.config.Api.EnableOpenApiUi | quote }}